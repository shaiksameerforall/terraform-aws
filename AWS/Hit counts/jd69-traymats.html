<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Device Redirect</title>

<script>
function identifyOS() {

  const ua = navigator.userAgent || "";

  console.log("UA:", ua);

  // iPhone / iPad
  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // Android
  const isAndroid = /Android/i.test(ua);

  // VERY STRICT Huawei detection
  // Only detect Huawei if manufacturer exists clearly
  const isHuawei =
    /HUAWEI/i.test(ua);

  // Detection order
  if (isIOS) {
    return 'iPhone';
  }

  // Huawei only if explicitly Huawei
  if (isAndroid && isHuawei) {
    return 'Huawei';
  }

  // Normal Android
  if (isAndroid !&& isHuawei) {
    return 'Android';
  }

  return 'Unknown';
}

// Tracking
function trackHit(os) {

  const url =
    "https://u2m2i4dbrd.execute-api.eu-central-1.amazonaws.com/prod/track" +
    "?file=" + encodeURIComponent("bus-albaikapplink") +
    "&os=" + encodeURIComponent(os);

  const img = new Image();
  img.src = url;
}

window.onload = function () {

  // Disable test mode
  const TEST_MODE = null;

  const os = TEST_MODE || identifyOS();

  console.log("Detected OS:", os);

  // Track
  trackHit(os);

  setTimeout(() => {

    // Huawei AppGallery
    if (os === 'Huawei') {

      window.location.replace(
        "https://appgallery.huawei.com/app/C115900563"
      );
    }

    // Android Play Store
    else if (os === 'Android') {

      window.location.replace(
        "https://play.google.com/store/apps/details?id=com.albaik.customer&hl=en"
      );
    }

    // Apple App Store
    else if (os === 'iPhone') {

      window.location.replace(
        "https://apps.apple.com/sa/app/albaik/id1514349620"
      );
    }

    // Fallback
    else {

      window.location.replace(
        "https://play.google.com/store/apps/details?id=com.albaik.customer&hl=en"
      );
    }

  }, 500);
};
</script>

</head>

<body>
<h1>Redirecting...</h1>
<p>Please wait while we redirect you to the appropriate app store.</p>
</body>
</html>

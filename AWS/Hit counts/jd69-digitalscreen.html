<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Device Redirect</title>

  <script>
    function identifyOS() {
      const ua = navigator.userAgent || "";
      console.log("UA:", ua);

      // iPhone / iPad
      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // Android
      const isAndroid = /Android/i.test(ua);

      // Strict Huawei detection
      const isHuawei = /HUAWEI/i.test(ua);

      // Detection order
      if (isIOS) {
        return 'iPhone';
      }

      if (isAndroid && isHuawei) {
        return 'Huawei';
      }

      // Normal Android (syntax fixed)
      if (isAndroid && !isHuawei) {
        return 'Android';
      }

      // Desktop fallback
      if (/Windows/i.test(ua)) return 'Windows';
      if (/Macintosh|Mac OS X/i.test(ua)) return 'MacOS';
      if (/Linux/i.test(ua)) return 'Linux';

      return 'Unknown';
    }

    // Tracking
    function trackHit(os) {
      const url =
        "https://u2m2i4dbrd.execute-api.eu-central-1.amazonaws.com/prod/track" +
        "?file=" + encodeURIComponent("jd69-digital-screens") +
        "&os=" + encodeURIComponent(os);

      // Send tracking hit via beacon or Image
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url);
      } else {
        const img = new Image();
        img.src = url;
      }
    }

    window.onload = function () {
      const TEST_MODE = null;
      const os = TEST_MODE || identifyOS();

      console.log("Detected OS:", os);

      // Fire tracking hit
      trackHit(os);

      setTimeout(() => {
        // Huawei AppGallery
        if (os === 'Huawei') {
          window.location.replace(
            "https://appgallery.huawei.com/app/C115900563"
          );
        }
        // Apple App Store
        else if (os === 'iPhone') {
          window.location.replace(
            "https://apps.apple.com/sa/app/albaik/id1514349620"
          );
        }
        // Android Play Store (and general fallback)
        else {
          window.location.replace(
            "https://play.google.com/store/apps/details?id=com.albaik.customer&hl=en"
          );
        }
      }, 500);
    };
  </script>
</head>

<body>
  <h1>Redirecting...</h1>
  <p>Please wait while we redirect you to the appropriate app store.</p>
</body>

</html>
